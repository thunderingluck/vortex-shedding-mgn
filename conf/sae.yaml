# sae:
#   # embedding extraction
#   split: test
sae:
  splits: [test]            # extract from MGN test set only
  out_root: sae_embeddings
  num_samples: 100          # all 100 test trajectories
  num_steps: 600            # full trajectory length

  val_fraction: 0.2              # 80/20 trajectory-level split (done inside train_sae_rand)
  seed: 42

  # SAE model
  d_in: 128
  expansion: 8     # κ=8
  lam: 3.0e-4      # λ=3e-4

  train:
    lr: 1.0e-4
    max_epochs: 50
    val_every: 10000           # validate every N optimizer steps
    patience: 8                # early-stop after N val cycles without improvement
    l0_patience: 10            # stop when L0 converges for this many consecutive evals
    l0_tol: 0.1                # L0 convergence tolerance in features/node
    ckpt_dir: ./sae_interp/checkpoints

  analysis:
    metric: variance   # variance | mean_abs | entropy :contentReference[oaicite:13]{index=13}
    topk: 50
    eta: 100          # number of top active nodes to visualize :contentReference[oaicite:14]{index=14}